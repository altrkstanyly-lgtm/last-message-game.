<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10171d">
  <meta name="description" content="آخر رسالة — حكاية تفاعلية عن الذاكرة والاستماع والاختيار.">
  <title>آخر رسالة | Last Message</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar"><a class="brand" href="#" aria-label="آخر رسالة" data-home>آخر رسالة<span>LAST MESSAGE</span></a><div id="chapter-label" class="chapter-label"></div><button class="icon-button" id="menu-button" aria-label="فتح القائمة" title="القائمة">☰</button></header>
    <main id="main" tabindex="-1"></main>
    <footer class="toolbar" id="toolbar" hidden>
      <button class="tool-button" data-panel="evidence"><span>◈</span> دفتر الأدلة <b id="evidence-count">0</b></button>
      <button class="tool-button" data-panel="messages"><span>▤</span> الرسائل</button>
      <button class="tool-button" data-panel="log"><span>≋</span> سجل الحوار</button>
      <div class="progress-wrap"><span id="progress-label">الفصل الأول</span><div class="progress-track"><i id="progress-bar"></i></div></div>
      <button class="tool-button settings-shortcut" data-panel="settings">الإعدادات</button>
    </footer>
  </div>
  <div id="overlay-root"></div>
  <script src="scripts/data.js"></script>
  <script src="scripts/audio.js"></script>
  <script src="scripts/game.js"></script>
  <script src="scripts/pwa.js"></script>
</body>
</html>
